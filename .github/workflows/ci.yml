name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Validate configuration
        run: python -m cdp validate
      - name: Unit and end-to-end tests
        run: pytest -q
      - name: Full pipeline on sample data
        run: |
          python -m cdp sample-data
          python -m cdp run

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wishunify:${{ github.sha }} .
